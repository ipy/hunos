<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1a1a1a" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Hunos</title>
    <style>
      * { box-sizing: border-box; }
      html, body, #root {
        margin: 0;
        padding: 0;
        height: 100dvh;
        width: 100%;
        overflow: hidden;
        font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        position: fixed;
        inset: 0;
      }

      /* Core animations */
      @keyframes slideUp {
        from { opacity: 0; transform: translateY(8px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      @keyframes fadeOut {
        from { opacity: 1; }
        to { opacity: 0; }
      }
      @keyframes screenSlideInRight {
        from { opacity: 0; transform: translateX(40px); }
        to { opacity: 1; transform: translateX(0); }
      }
      @keyframes screenSlideInLeft {
        from { opacity: 0; transform: translateX(-20px); }
        to { opacity: 1; transform: translateX(0); }
      }
      @keyframes scaleIn {
        from { opacity: 0; transform: scale(0.92); }
        to { opacity: 1; transform: scale(1); }
      }
      @keyframes menuReveal {
        from { opacity: 0; transform: scale(0.88) translateY(-4px); }
        to { opacity: 1; transform: scale(1) translateY(0); }
      }
      @keyframes sheetSlideUp {
        from { transform: translateY(100%); }
        to { transform: translateY(0); }
      }
      @keyframes toastSlideUp {
        from { opacity: 0; transform: translateY(16px) scale(0.95); }
        to { opacity: 1; transform: translateY(0) scale(1); }
      }
      @keyframes toastSlideOut {
        from { opacity: 1; transform: translateY(0) scale(1); }
        to { opacity: 0; transform: translateY(-8px) scale(0.95); }
      }
      @keyframes searchExpand {
        from { opacity: 0; max-height: 0; padding-top: 0; padding-bottom: 0; }
        to { opacity: 1; max-height: 60px; padding-top: 0; padding-bottom: 10px; }
      }
      @keyframes fabPulse {
        0% { box-shadow: 0 4px 16px rgba(232, 93, 74, 0.3); }
        50% { box-shadow: 0 6px 24px rgba(232, 93, 74, 0.45); }
        100% { box-shadow: 0 4px 16px rgba(232, 93, 74, 0.3); }
      }
      @keyframes noteCardMount {
        from { opacity: 0; transform: translateY(6px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes backdropFadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }

      /* Thin elegant scrollbar */
      ::-webkit-scrollbar { width: 4px; height: 0; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.12); border-radius: 4px; }
      ::-webkit-scrollbar-thumb:hover { background: rgba(0,0,0,0.2); }
      @media (prefers-color-scheme: dark) {
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.18); }
      }

      /* Smooth focus transitions */
      button { transition: background-color 0.15s ease, transform 0.1s ease, opacity 0.15s ease; }
      button:focus-visible {
        outline: 2px solid #E85D4A;
        outline-offset: 2px;
      }
      button:active { transform: scale(0.97); }

      /* Selection color */
      ::selection { background: rgba(232, 93, 74, 0.2); }

      /* Smooth input transitions */
      input { transition: background-color 0.2s ease, border-color 0.2s ease; }

      /* Reduced motion */
      @media (prefers-reduced-motion: reduce) {
        * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
